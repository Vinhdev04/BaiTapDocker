# ════════════════════════════════════════════
# CI/CD PIPELINE — Bài 7 HUTECH
# Tự động Build & Push Docker Image lên Hub
# ════════════════════════════════════════════

name: 🚀 CI/CD — Build & Push Docker Image

# ── Khi nào kích hoạt? ──────────────────────
on:
  push:
    branches:
      - main          # Chạy khi push lên nhánh main
  pull_request:
    branches:
      - main          # Chạy khi có Pull Request vào main

# ── Danh sách công việc (Jobs) ───────────────
jobs:

  # ════════════════════════════════════════
  # JOB 1: BUILD & PUSH BÀI TẬP 1
  # ════════════════════════════════════════
  build-and-push-baitap1:
    name: 📦 Build BaiTap1 — Dockerfile đơn lẻ
    runs-on: ubuntu-latest        # Dùng máy ảo Ubuntu của GitHub

    steps:
      # Bước 1: Lấy mã nguồn từ GitHub
      - name: ✅ Bước 1 — Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Docker Hub (dùng Secrets)
      - name: 🔐 Bước 2 — Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 3: Thiết lập Docker Buildx (công cụ build nâng cao)
      - name: 🔧 Bước 3 — Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 4: Build Image và Push lên Docker Hub
      - name: 🐳 Bước 4 — Build & Push Image BaiTap1
        uses: docker/build-push-action@v5
        with:
          context: ./bai-tap-1       # Thư mục chứa Dockerfile
          file: ./bai-tap-1/Dockerfile
          push: true                 # Bật push lên Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap1-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap1-app:${{ github.sha }}
          cache-from: type=gha       # Dùng cache để build nhanh hơn
          cache-to: type=gha,mode=max

      # Bước 5: In thông tin kết quả
      - name: 📋 Bước 5 — Thông báo kết quả
        run: |
          echo "✅ BaiTap1 image đã được push thành công!"
          echo "📍 Image: ${{ secrets.DOCKERHUB_USERNAME }}/baitap1-app:latest"
          echo "🔖 SHA tag: ${{ secrets.DOCKERHUB_USERNAME }}/baitap1-app:${{ github.sha }}"

  # ════════════════════════════════════════
  # JOB 2: BUILD & PUSH BÀI TẬP 2 (BACKEND)
  # ════════════════════════════════════════
  build-and-push-baitap2-backend:
    name: 📦 Build BaiTap2 — Backend Service
    runs-on: ubuntu-latest
    needs: build-and-push-baitap1   # Chờ Job 1 xong mới chạy

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./bai-tap-2/backend
          file: ./bai-tap-2/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap2-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap2-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Thông báo kết quả
        run: |
          echo "✅ BaiTap2 Backend image đã được push!"
          echo "📍 Image: ${{ secrets.DOCKERHUB_USERNAME }}/baitap2-backend:latest"