# ════════════════════════════════════════════════════════════
# CI/CD PIPELINE — BaiTap01 (HUTECH Bài 7)
# Tự động Build & Push Docker Image lên Docker Hub
# Kích hoạt: mỗi khi push code lên nhánh main
# ════════════════════════════════════════════════════════════

name: 🚀 CI/CD — BaiTap01 Build & Push Docker Image

# ── Khi nào kích hoạt? ──────────────────────────────────────
on:
  push:
    branches:
      - main          # Chạy tự động khi push lên nhánh main
  pull_request:
    branches:
      - main          # Chạy khi có Pull Request vào main

# ── Danh sách công việc (Jobs) ───────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════
  # JOB: BUILD & PUSH IMAGE LÊN DOCKER HUB
  # ══════════════════════════════════════════════════════════
  build-and-push:
    name: 📦 Build & Push Docker Image — BaiTap01
    runs-on: ubuntu-latest        # Dùng máy ảo Ubuntu của GitHub

    steps:

      # ── Bước 1: Lấy mã nguồn từ GitHub ──────────────────
      - name: ✅ Bước 1 — Checkout source code
        uses: actions/checkout@v4

      # ── Bước 2: Đăng nhập vào Docker Hub ────────────────
      # Dùng Secrets đã khai báo trong Settings > Secrets
      - name: 🔐 Bước 2 — Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Bước 3: Thiết lập Docker Buildx ─────────────────
      # Buildx cho phép build nhanh hơn và hỗ trợ cache
      - name: 🔧 Bước 3 — Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Bước 4: Build Image & Push lên Docker Hub ────────
      # Tags gồm: :latest và :<commit-sha> để dễ rollback
      - name: 🐳 Bước 4 — Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./baitap01          # Thư mục chứa Dockerfile
          file: ./baitap01/Dockerfile  # Đường dẫn đến Dockerfile
          push: true                   # Bật push lên Docker Hub
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap01-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/baitap01-app:${{ github.sha }}
          cache-from: type=gha         # Dùng GitHub Actions Cache
          cache-to: type=gha,mode=max

      # ── Bước 5: Thông báo kết quả ────────────────────────
      - name: 📋 Bước 5 — Thông báo kết quả
        run: |
          echo "════════════════════════════════════════"
          echo "✅ BaiTap01 đã được deploy thành công!"
          echo "════════════════════════════════════════"
          echo "📍 Image: ${{ secrets.DOCKERHUB_USERNAME }}/baitap01-app:latest"
          echo "🔖 SHA:   ${{ secrets.DOCKERHUB_USERNAME }}/baitap01-app:${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "════════════════════════════════════════"