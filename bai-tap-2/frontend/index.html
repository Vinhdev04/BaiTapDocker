<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐳 Docker Compose — Frontend + Backend</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 { font-size: 2rem; margin-bottom: 10px; }

    .subtitle {
      color: #89b4fa;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .status-card {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #result {
      font-size: 1rem;
      line-height: 1.6;
      color: #cdd6f4;
      white-space: pre-wrap;
      text-align: left;
    }

    button {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #89b4fa, #74c7ec);
      border: none;
      border-radius: 50px;
      color: #1e1e2e;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(137,180,250,0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(137,180,250,0.5);
    }

    button:active { transform: translateY(0); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 5px;
    }

    .badge-blue { background: #1e3a5f; color: #89b4fa; }
    .badge-green { background: #1a3a2a; color: #a6e3a1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐳 Docker Compose</h1>
    <p class="subtitle">Ứng dụng Frontend + Backend trong Docker</p>

    <div>
      <span class="badge badge-blue">Frontend: Nginx :8080</span>
      <span class="badge badge-green">Backend: Node.js :4000</span>
    </div>

    <div class="status-card">
      <div id="result">Nhấn nút bên dưới để gọi Backend API...</div>
    </div>

    <button onclick="callBackend()">🚀 Gọi Backend API</button>
  </div>

  <script>
    async function callBackend() {
      const resultEl = document.getElementById('result');
      resultEl.textContent = '⏳ Đang gọi API...';

      try {
        // Gọi tới backend container qua cổng 4000
        const response = await fetch('http://localhost:4000');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultEl.textContent = `❌ Lỗi kết nối Backend!\n\n${error.message}\n\nHãy đảm bảo backend đang chạy tại port 4000.`;
      }
    }
  </script>
</body>
</html>
