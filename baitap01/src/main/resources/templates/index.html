<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phạm Công Vinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --blue-deep:   #0a2342;
        --blue-mid:    #1a4a8a;
        --blue-bright: #2d7dd2;
        --blue-light:  #5ba3f5;
        --blue-pale:   #dbeafe;
        --white:       #ffffff;
        --off-white:   #f0f6ff;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--blue-deep);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* ── Animated background grid ── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(45,125,210,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(45,125,210,0.07) 1px, transparent 1px);
        background-size: 60px 60px;
        animation: gridDrift 20s linear infinite;
      }

      @keyframes gridDrift {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(60px, 60px); }
      }

      /* ── Floating orbs ── */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.25;
        animation: orbFloat linear infinite;
        pointer-events: none;
      }
      .orb-1 {
        width: 500px; height: 500px;
        background: radial-gradient(circle, #2d7dd2, transparent 70%);
        top: -150px; left: -150px;
        animation-duration: 18s;
      }
      .orb-2 {
        width: 400px; height: 400px;
        background: radial-gradient(circle, #1a4a8a, transparent 70%);
        bottom: -100px; right: -100px;
        animation-duration: 22s;
        animation-direction: reverse;
      }
      .orb-3 {
        width: 300px; height: 300px;
        background: radial-gradient(circle, #5ba3f5, transparent 70%);
        top: 50%; right: 10%;
        animation-duration: 14s;
      }

      @keyframes orbFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%       { transform: translate(30px, -40px) scale(1.05); }
        66%       { transform: translate(-20px, 20px) scale(0.95); }
      }

      /* ── Main card ── */
      .card {
        position: relative;
        z-index: 10;
        width: min(580px, 92vw);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(91,163,245,0.2);
        border-radius: 24px;
        padding: 56px 48px 52px;
        backdrop-filter: blur(20px);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.05) inset,
          0 32px 80px rgba(0,0,0,0.5),
          0 0 120px rgba(45,125,210,0.12);
        animation: cardReveal 0.9s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes cardReveal {
        from { opacity: 0; transform: translateY(40px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ── Top badge ── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(45,125,210,0.15);
        border: 1px solid rgba(91,163,245,0.3);
        border-radius: 100px;
        padding: 6px 16px;
        margin-bottom: 36px;
        animation: fadeSlide 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) both;
      }

      .badge-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #5ba3f5;
        box-shadow: 0 0 8px #5ba3f5;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(1.3); }
      }

      .badge span {
        font-size: 0.75rem;
        font-weight: 500;
        color: #93c5fd;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Greeting ── */
      .greeting {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.1rem, 3vw, 1.3rem);
        color: #93c5fd;
        font-weight: 400;
        font-style: italic;
        margin-bottom: 8px;
        animation: fadeSlide 0.7s 0.35s cubic-bezier(0.16,1,0.3,1) both;
      }

      /* ── Divider ── */
      .divider {
        width: 48px;
        height: 2px;
        background: linear-gradient(90deg, #2d7dd2, transparent);
        margin: 20px 0 24px;
        animation: dividerExpand 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes dividerExpand {
        from { width: 0; opacity: 0; }
        to   { width: 48px; opacity: 1; }
      }

      /* ── Sub text ── */
      .sub {
        font-size: 0.9rem;
        color: rgba(147,197,253,0.6);
        font-weight: 300;
        letter-spacing: 0.04em;
        margin-bottom: 32px;
        animation: fadeSlide 0.7s 0.5s cubic-bezier(0.16,1,0.3,1) both;
      }

      /* ── Name display ── */
      .name-wrapper {
        position: relative;
        animation: fadeSlide 0.9s 0.65s cubic-bezier(0.16,1,0.3,1) both;
      }

      .name-box {
        position: relative;
        background: linear-gradient(135deg, #0a2342 0%, #1a4a8a 100%);
        border: 1px solid rgba(91,163,245,0.35);
        border-radius: 16px;
        padding: 32px 36px;
        overflow: hidden;
      }

      /* Shimmer sweep */
      .name-box::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255,255,255,0.06) 50%,
          transparent 70%
        );
        animation: shimmer 4s ease-in-out infinite;
      }

      @keyframes shimmer {
        0%, 100% { transform: translateX(-100%); }
        50%       { transform: translateX(100%); }
      }

      /* Corner accents */
      .name-box::after {
        content: '';
        position: absolute;
        top: -1px; right: -1px;
        width: 60px; height: 60px;
        border-top: 2px solid #5ba3f5;
        border-right: 2px solid #5ba3f5;
        border-radius: 0 16px 0 0;
        opacity: 0.6;
      }

      .corner-bl {
        position: absolute;
        bottom: -1px; left: -1px;
        width: 60px; height: 60px;
        border-bottom: 2px solid #5ba3f5;
        border-left: 2px solid #5ba3f5;
        border-radius: 0 0 0 16px;
        opacity: 0.6;
      }

      .name-label {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(147,197,253,0.5);
        margin-bottom: 10px;
        font-weight: 500;
      }

      .name-text {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        font-weight: 900;
        line-height: 1.15;
        background: linear-gradient(135deg, #ffffff 0%, #93c5fd 60%, #5ba3f5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.5px;
      }

      /* ── Footer row ── */
      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 36px;
        animation: fadeSlide 0.7s 0.8s cubic-bezier(0.16,1,0.3,1) both;
      }

      .tag {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(147,197,253,0.4);
        font-weight: 400;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots span {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: rgba(91,163,245,0.4);
      }

      .dots span:nth-child(2) {
        background: rgba(91,163,245,0.65);
        transform: scale(1.2);
      }

      .dots span:nth-child(3) {
        background: rgba(91,163,245,0.25);
      }
    </style>
  </head>
  <body>

    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Card -->
    <div class="card">

      <div class="badge">
        <span class="badge-dot"></span>
        <span>Spring Boot Application</span>
      </div>

      <p class="greeting">Xin chào,</p>

      <div class="divider"></div>

      <p class="sub">Đây là ứng dụng của</p>

      <div class="name-wrapper">
        <div class="name-box">
          <div class="corner-bl"></div>
          <p class="name-label">Sinh viên thực hiện</p>
          <p class="name-text" th:text="${name}">Phạm Công Vinh</p>
        </div>
      </div>

      <div class="footer-row">
        <span class="tag">HUTECH &nbsp;·&nbsp; Bài 7 CI/CD</span>
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
      </div>

    </div>

  </body>
</html>
